<div class="x-page settings">
  <h1 class="x-page-title">{{ 'Settings' | t }}</h1>

  <nav class="smenu">
    <a class="smenu-row x-card" *ngFor="let row of rows()" [routerLink]="['/settings', row.id]" [attr.data-section]="row.id">
      <span class="smenu-icon" aria-hidden="true">{{ row.icon }}</span>
      <span class="smenu-text">
        <strong>{{ row.title | t }}</strong>
        <small>{{ row.status }}</small>
      </span>
      <span class="smenu-arrow" aria-hidden="true">›</span>
    </a>
  </nav>

  <p class="settings-version">X Money · v{{ version }}</p>
</div>
