<!-- App shell: routed page + bottom navigation -->
<app-sync-banner></app-sync-banner>
@defer (on idle) {
  <app-update-banner></app-update-banner>
}
<main class="app-main">
  <router-outlet />
</main>
<app-navbar></app-navbar>
<app-undo-toast></app-undo-toast>

<!-- PIN lock overlay -->
<div class="app-lock" *ngIf="lock.locked()">
  <span class="app-lock-brand">X <span>Money</span></span>
  <span class="app-lock-icon">🔒</span>
  <input
    class="x-input app-lock-input"
    type="password"
    inputmode="numeric"
    maxlength="8"
    [placeholder]="'Enter PIN' | t"
    [(ngModel)]="pin"
    (keyup.enter)="tryUnlock()"
    name="pin"
  />
  <p class="app-lock-error" *ngIf="pinError()">{{ 'Wrong PIN' | t }}</p>
  <button class="x-btn app-lock-btn" (click)="tryUnlock()">{{ 'Unlock' | t }}</button>
</div>

<!-- Account gate (needs a session) and first-sync wizard; the PIN lock stays on top -->
@if (auth.needsAuth() || auth.recoveryCode()) {
  @defer {
    <app-auth-gate></app-auth-gate>
  }
}
@if (auth.mode() === 'signed-in' && sync.link().phase !== 'none') {
  @defer {
    <app-link-wizard></app-link-wizard>
  }
}
