<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>X Money · No se conectó</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1b1b1b; --mut:#5b5b5b; --acc:#b87800; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#ececec; --mut:#a8a8a8; --acc:#ffb000; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:28rem; margin:0 auto; padding:18vh 1.2rem 3rem; text-align:center; }
  .ic { font-size:3rem; line-height:1; }
  h1 { font-size:1.4rem; margin:.8rem 0 .4rem; }
  p { color:var(--mut); margin:.4rem 0; }
  .brand { margin-top:2.5rem; font-weight:700; color:var(--fg); } .brand span { color:var(--acc); }
</style>
</head>
<body>
<main>
<div class="ic" aria-hidden="true">⚠️</div>
<h1>No se conectó el correo</h1>
<p>No se concedió el acceso o Google no aceptó la conexión.</p>
<p>Vuelve a X Money y toca «Conectar Gmail» para intentarlo de nuevo.</p>
<div class="brand">X <span>Money</span></div>
</main>
</body>
</html>
